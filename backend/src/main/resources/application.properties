spring.application.name=case-tracker
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server configuration
server.port=${SERVER_PORT:8080}

# JPA configuration
spring.jpa.open-in-view=false

# Schema migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema before Flyway baseline
spring.flyway.validate-on-migrate=true

# File upload size limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# App configuration
app.image.storage.path=${APP_IMAGE_STORAGE_PATH:./var/medical-images}
app.image.max-size-mb=${APP_IMAGE_MAX_SIZE_MB:10}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}
app.backup.storage.path=${APP_BACKUP_STORAGE_PATH:./var/backups}
app.backup.pg-dump-command=${APP_BACKUP_PG_DUMP_COMMAND:pg_dump}
app.backup.psql-command=${APP_BACKUP_PSQL_COMMAND:psql}

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
